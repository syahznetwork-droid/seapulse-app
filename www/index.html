    function getRelativeIso(hoursOffset) {
      const d = new Date(Date.now() + hoursOffset * 3600 * 1000);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function formatDisplayDateTime(isoStr) {
      if (!isoStr) return '—';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
      });
    }
    function getUrgencyBadge(isoStr, nowMs) {
      if (!isoStr) return { label: 'N/A', level: 'none', badgeClass: 'bg-slate-500/10 text-slate-500', hoursLeft: Infinity };
      const target = new Date(isoStr).getTime();
      if (isNaN(target)) return { label: 'Invalid', level: 'none', badgeClass: 'bg-slate-500/10 text-slate-500', hoursLeft: Infinity };
      const diffHrs = (target - nowMs) / (1000 * 3600);
      if (diffHrs < 0) {
        const hrsAgo = Math.abs(diffHrs);
        let overdueLabel = '';
        if (hrsAgo < 24) {
          overdueLabel = `OVERDUE (${Math.round(hrsAgo)}h ago)`;
        } else {
          const daysAgo = Math.floor(hrsAgo / 24);
          overdueLabel = `OVERDUE (${daysAgo}d ago)`;
        }
        return { label: overdueLabel, level: 'overdue', badgeClass: 'bg-rose-600 text-white font-bold', hoursLeft: diffHrs };
      }
      if (diffHrs <= 24) {
        return { label: `CRITICAL (<24h • ${Math.max(1, Math.round(diffHrs))}h left)`, level: 'critical', badgeClass: 'bg-rose-500/20 text-rose-600 border border-rose-500/40 font-bold', hoursLeft: diffHrs };
      }
      if (diffHrs <= 72) {
        const days = Math.ceil(diffHrs / 24);
        return { label: `APPROACHING (${days}d • ${Math.round(diffHrs)}h)`, level: 'warning', badgeClass: 'bg-amber-500/20 text-amber-700 border border-amber-500/40 font-semibold', hoursLeft: diffHrs };
      }
      const daysLeft = Math.floor(diffHrs / 24);
      return { label: `On Track (${daysLeft}d)`, level: 'normal', badgeClass: 'bg-emerald-500/15 text-emerald-600 font-medium', hoursLeft: diffHrs };

            deletedAt: formatDisplayDateTime(new Date().toISOString()),

          notify(`Created new vendor invoice: ${newInv.invoiceNumber}`);

        setInvoices(prev => prev.filter(i => i.id !== inv.id));

        } else {
          setDismissedVessels(prev => [...prev, al.alertKey]);

        setDeletedItems(prev => [{
          deletedId: `DEL-${Date.now()}`,
          itemType: 'Alert',
          title: `${al.cargoWiseNumber} — ${al.cutoffName} (${formatDisplayDateTime(al.iso)})`,
          deletedAt: ts,
          deletedBy: currentUser,
          data: al

        notify(`Dismissed alert for ${al.cargoWiseNumber} (${al.cutoffName}) and moved to Recently Deleted.`);

          setInvoices(prev => [delItem.data, ...prev]);

            return { ...s, activityLogs: [restoredLog, ...(s.activityLogs || [])] };
          }));
        } else if (delItem.itemType === 'Document') {
          const docData = delItem.data;
          setShipments(prev => prev.map(s => {
            if (s.id !== docData.shipmentId) return s;
            return { ...s, documents: { ...(s.documents || {}), [docData.docKey]: docData.docData } };

        } else if (delItem.itemType === 'Checklist Item') {

    function InvoiceFormModal({ invoice, shipments, onClose, onSave }) {
      const [form, setForm] = useState(invoice || {
        vendorName: '', invoiceNumber: '', amount: 0, currency: 'USD', dueDate: new Date().toISOString().slice(0, 10),
        shipmentId: shipments[0]?.id || '', shipmentRef: shipments[0] ? `${shipments[0].cargoWiseNumber} / ${shipments[0].ciplNumber}` : '', status: 'Pending',
        documentName: '', documentData: ''
      });
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          setForm(prev => ({ ...prev, documentName: file.name, documentData: uploadEvent.target.result }));
        };
        reader.readAsDataURL(file);
      };
      const handleShipmentSelect = (shpId) => {
        const found = shipments.find(s => s.id === shpId);
        setForm(prev => ({ ...prev, shipmentId: shpId, shipmentRef: found ? `${found.cargoWiseNumber} / ${found.ciplNumber}` : 'General Overhead' }));
      };
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.vendorName || !form.invoiceNumber) return;
        onSave(form);
      };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-xs">
          <form onSubmit={handleSubmit} className="theme-surface border theme-border rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
            <div className="px-5 py-4 border-b theme-border flex items-center justify-between">
              <h2 className="text-base font-extrabold">{invoice ? 'Edit Vendor Invoice' : 'Add Vendor Invoice'}</h2>
              <button type="button" onClick={onClose} className="p-1.5 rounded-xl theme-subtle border"><Icon name="x" className="w-4 h-4" /></button>
            </div>
            <div className="p-5 space-y-3 text-xs">
              <FormInput label="Vendor Name *" value={form.vendorName} onChange={v => setForm({ ...form, vendorName: v })} required />
              <FormInput label="Invoice Number *" value={form.invoiceNumber} onChange={v => setForm({ ...form, invoiceNumber: v })} required />
              <div className="grid grid-cols-2 gap-3">
                <FormInput label="Invoice Amount *" type="number" step="0.01" value={form.amount} onChange={v => setForm({ ...form, amount: Number(v) })} required />
                <FormSelect label="Currency" value={form.currency} onChange={v => setForm({ ...form, currency: v })} options={['USD', 'MYR', 'SGD', 'EUR', 'CNY']} />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <FormInput label="Due Date" type="date" value={form.dueDate} onChange={v => setForm({ ...form, dueDate: v })} />

              <label className="block space-y-1">
                <span className="font-semibold theme-text-muted">Associated CargoWise Shipment</span>
                <select value={form.shipmentId} onChange={e => handleShipmentSelect(e.target.value)} className="w-full px-3 py-2 rounded-xl theme-subtle border">
                  <option value="">General / Unlinked</option>
                  {shipments.map(s => <option key={s.id} value={s.id}>{s.cargoWiseNumber} ({s.pol} → {s.pod})</option>)}
                </select>
              </label>
              <label className="block space-y-1">
                <span className="font-semibold theme-text-muted">Upload Invoice Document (PDF / Image)</span>
                <div className="flex items-center gap-2">
                  <input type="file" accept=".pdf,image/*" onChange={handleFileUpload} className="w-full px-3 py-2 rounded-xl theme-subtle border text-xs cursor-pointer" />
                </div>
                {form.documentName && <div className="text-[11px] text-emerald-600 font-semibold mt-1">Attached: {form.documentName}</div>}
              </label>
            </div>
            <div className="px-5 py-3.5 border-t theme-border flex justify-end gap-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl theme-subtle border text-xs font-semibold">Cancel</button>
              <button type="submit" className="px-5 py-2 rounded-xl theme-accent-bg font-semibold">Save Invoice</button>
            </div>
          </form>
        </div>

    function PortAutocompleteInput({ label, value, onChange }) {
      const [isOpen, setIsOpen] = useState(false);
      const filteredPorts = UN_LOCODE_PORTS.filter(p => p.toLowerCase().includes((value || '').toLowerCase()));
      return (
        <label className="block space-y-1 relative">
          <span className="font-semibold theme-text-muted">{label}</span>
          <input
            type="text"
            value={value}
            onChange={e => { onChange(e.target.value); setIsOpen(true); }}
            onFocus={() => setIsOpen(true)}
            onBlur={() => setTimeout(() => setIsOpen(false), 200)}
            placeholder="Type port name or UN/LOCODE (e.g. MYPKG)"
            className="w-full px-3 py-2 rounded-xl theme-subtle border focus:outline-none focus:border-sky-500"
          />
          {isOpen && filteredPorts.length > 0 && (
            <div className="absolute z-30 left-0 right-0 mt-1 max-h-48 overflow-y-auto theme-surface border theme-border rounded-xl shadow-xl">
              {filteredPorts.map(port => (
                <div
                  key={port}
                  onMouseDown={(e) => { e.preventDefault(); }}
                  onClick={() => { onChange(port); setIsOpen(false); }}
                  className="px-3 py-2 hover:bg-sky-500/10 cursor-pointer text-xs font-medium border-b theme-border last:border-none"
                >
                  {port}
                </div>
              ))}
            </div>
          )}
        </label>
      );
    }
    function FormInput({ label, value, onChange, type = 'text', required = false, placeholder = '', step }) {
      return (
        <label className="block space-y-1">
          <span className="font-semibold theme-text-muted">{label}</span>
          <input type={type} step={step} required={required} value={value} placeholder={placeholder} onChange={e => onChange(e.target.value)} className="w-full px-3 py-2 rounded-xl theme-subtle border focus:outline-none focus:border-sky-500" />
        </label>
      );
    }
    function FormSelect({ label, value, onChange, options }) {
      return (
        <label className="block space-y-1">
          <span className="font-semibold theme-text-muted">{label}</span>
          <select value={value} onChange={e => onChange(e.target.value)} className="w-full px-3 py-2 rounded-xl theme-subtle border focus:outline-none focus:border-sky-500">
            {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
          </select>
        </label>
      );
    }
    
    // Stable React 18 / React 17 Mounting
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
